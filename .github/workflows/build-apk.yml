name: Build Android APK

# Builds a debug APK on every push and publishes it as a GitHub Release,
# plus attaches it as a workflow artifact - no local Android SDK setup needed.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Explicit package list: the action's default list includes the removed
      # "tools" package, which makes sdkmanager fail.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find android/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$apk" EclipseRealms.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-debug-apk
          path: EclipseRealms.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" EclipseRealms.apk \
            --title "Eclipse Realms v1.0.${{ github.run_number }}" \
            --notes "Debug Android build. Download EclipseRealms.apk and install it on your phone."
