<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="25%" stop-color="#F97316" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Deep Blue Ocean / Spine Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="50%" stop-color="#0038A8" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>

    <!-- Gold Sun Gradient -->
    <linearGradient id="goldSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Clip path for the central circle badge -->
    <clipPath id="circleBadgeClip">
      <circle cx="256" cy="256" r="148" />
    </clipPath>

    <!-- Subtle inner shadow for squircle -->
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#squircleGrad)" />

  <!-- Outer Squircle Rim Glow -->
  <rect x="25" y="25" width="462" height="462" rx="107" ry="107" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- 2. Central White Outer Ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#FFFFFF" stroke-width="15" filter="url(#subtleDrop)" />
  <circle cx="256" cy="256" r="148" fill="#FFFFFF" />

  <!-- 3. Inner Content Clipped into Circle -->
  <g clip-path="url(#circleBadgeClip)">
    <!-- Base circle canvas background -->
    <circle cx="256" cy="256" r="148" fill="#F8FAFC" />

    <!-- A. Right Side: Flowing Indigenous Ribbon Arcs (Dynamic Weave Layers) -->
    <!-- Arc 1: Deep Blue Outer Arc -->
    <path d="M 270 120 C 350 130 400 200 395 280 C 390 340 340 390 280 400 L 256 256 Z" fill="#0284C7" />
    <!-- Arc 2: Golden Yellow Ribbon -->
    <path d="M 285 135 C 355 155 390 220 380 290 C 370 340 330 385 280 400 L 256 256 Z" fill="#FACC15" />
    <!-- Arc 3: Crimson Red Ribbon -->
    <path d="M 298 150 C 355 175 380 235 370 295 C 360 340 320 380 275 395 L 256 256 Z" fill="#DC2626" />
    <!-- Arc 4: Emerald Green Ribbon -->
    <path d="M 310 165 C 355 195 370 245 360 300 C 350 335 315 370 275 390 L 256 256 Z" fill="#059669" />
    <!-- Arc 5: Radiant Orange Ribbon -->
    <path d="M 320 185 C 355 215 360 260 350 305 C 340 335 310 365 270 385 L 256 256 Z" fill="#EA580C" />

    <!-- Traditional Geometric Woven Texture across the sweeping ribbons -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <!-- Crosshatch & diamond motifs on top-right woven band -->
      <path d="M 290 140 L 330 180 M 310 135 L 350 175 M 330 145 L 365 185" />
      <path d="M 330 140 L 290 180 M 350 135 L 310 175 M 365 145 L 330 185" />
      <path d="M 345 200 L 385 240 M 335 220 L 375 260 M 325 240 L 365 280" />
      <path d="M 385 200 L 345 240 M 375 220 L 335 260 M 365 240 L 325 280" />
      <!-- Small diamonds in weave -->
      <polygon points="320,160 326,166 320,172 314,166" fill="#FACC15" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="345,185 351,191 345,197 339,191" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="360,225 366,231 360,237 354,231" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="350,265 356,271 350,277 344,271" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- B. Lower Sun Rays (Philippine 8-Ray Golden Sun) -->
    <g fill="url(#goldSunGrad)" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round">
      <!-- Center Bottom Ray (pointing down) -->
      <polygon points="256,310 248,375 256,388 264,375" />
      <polygon points="256,310 252,365 256,375 260,365" fill="#FEF08A" />

      <!-- Bottom Left Ray -->
      <polygon points="245,305 205,355 210,368 222,358" />
      <polygon points="245,305 212,350 216,358 224,352" fill="#FEF08A" />

      <!-- Far Bottom Left Ray -->
      <polygon points="235,295 180,330 182,342 195,335" />

      <!-- Bottom Right Ray -->
      <polygon points="267,305 307,355 302,368 290,358" />
      <polygon points="267,305 300,350 296,358 288,352" fill="#FEF08A" />

      <!-- Far Bottom Right Ray -->
      <polygon points="277,295 332,330 330,342 317,335" />

      <!-- Minor decorative rays / sun flare sparks -->
      <polygon points="230,340 236,360 242,345" fill="#FDE047" stroke="none" />
      <polygon points="270,345 276,360 282,340" fill="#FDE047" stroke="none" />
    </g>

    <!-- C. Stylized Letter "P" with Geometric Weaving & Map of Philippines -->
    <!-- The outer contour of the letter P -->
    <g id="letter-p-group">
      <!-- P Head (Upper Loop) Background with Tribal Weave -->
      <path d="M 195 142 L 285 142 C 328 142 355 168 355 208 C 355 248 328 274 285 274 L 195 274 Z" fill="#0284C7" />

      <!-- Colorful Indigenous Blocks inside the P Loop -->
      <!-- Segment 1: Turquoise / Cyan geometric block -->
      <path d="M 215 142 L 275 142 L 260 185 L 215 185 Z" fill="#0284C7" />
      <path d="M 215 142 L 245 142 L 215 172 Z" fill="#0369A1" />
      <path d="M 245 142 L 275 142 L 245 172 Z" fill="#38BDF8" />

      <!-- Segment 2: Emerald Green & Gold Steps -->
      <path d="M 275 142 L 315 142 C 335 152 345 168 350 185 L 295 185 L 280 160 Z" fill="#059669" />
      <polygon points="285,145 300,160 285,175 270,160" fill="#FACC15" />
      <polygon points="315,155 328,168 315,181 302,168" fill="#DC2626" />

      <!-- Segment 3: Coral & Golden Yellow Weaves on outer curve of loop -->
      <path d="M 350 185 C 355 200 355 216 350 231 L 295 231 L 295 185 Z" fill="#EA580C" />
      <polygon points="340,208 348,208 348,216 340,216" fill="#FEF08A" />
      <polygon points="325,198 335,208 325,218 315,208" fill="#FFFFFF" />
      <polygon points="305,198 315,208 305,218 295,208" fill="#FACC15" />

      <!-- Segment 4: Lower Loop Bar (Red & Yellow indigenous patterns) -->
      <path d="M 295 231 C 345 231 345 274 285 274 L 215 274 L 235 231 Z" fill="#DC2626" />
      <polygon points="265,242 278,255 265,268 252,255" fill="#FACC15" />
      <polygon points="295,242 308,255 295,268 282,255" fill="#0284C7" />
      <polygon points="320,246 328,254 320,262 312,254" fill="#FEF08A" />

      <!-- Traditional Zig-Zag & Tribal Inset Lines -->
      <path d="M 220 152 L 230 162 L 240 152 L 250 162 L 260 152" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 230 264 L 240 254 L 250 264 L 260 254 L 270 264" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- P Stem / Spine: Deep Navy Blue with Philippine Archipelago Map -->
      <path d="M 172 142 L 218 142 L 218 368 L 172 368 Z" fill="url(#oceanGrad)" />

      <!-- Traditional triangular weaving base at bottom of stem -->
      <polygon points="172,345 195,368 218,345" fill="#DC2626" />
      <polygon points="182,348 195,361 208,348" fill="#FACC15" />
      <polygon points="172,325 195,348 218,325" fill="#0284C7" />

      <!-- PHILIPPINE MAP SILHOUETTE (Crisp White inside the Navy Stem) -->
      <g fill="#FFFFFF" opacity="0.95" id="philippine-map">
        <!-- Batanes / Babuyan Islands -->
        <circle cx="195" cy="155" r="1.5" />
        <circle cx="193" cy="159" r="1.5" />
        <circle cx="196" cy="162" r="1.8" />

        <!-- Northern Luzon (Ilocos, Cagayan, Cordillera) -->
        <path d="M 191 166 C 188 170 188 178 190 184 C 193 188 197 188 200 183 C 201 176 199 168 195 166 Z" />
        <!-- Central Luzon & Zambales Peninsula -->
        <path d="M 189 184 C 186 188 186 195 188 202 C 192 205 196 202 197 195 C 197 190 193 185 189 184 Z" />
        <!-- Southern Luzon / Bicol Peninsula -->
        <path d="M 194 200 C 197 203 203 206 207 212 C 210 216 206 220 202 216 C 198 212 195 206 194 200 Z" />
        <!-- Catanduanes & Marinduque -->
        <circle cx="210" cy="208" r="2.2" />
        <circle cx="193" cy="209" r="2" />

        <!-- Mindoro Island -->
        <path d="M 183 206 C 180 210 180 216 183 220 C 186 221 189 217 188 211 C 187 207 185 205 183 206 Z" />

        <!-- Palawan Archipelago (Long diagonal island chain) -->
        <path d="M 174 218 C 171 224 167 235 165 244 C 164 247 167 248 168 244 C 171 236 175 226 177 220 Z" />
        <circle cx="177" cy="216" r="1.6" /> <!-- Calamianes -->

        <!-- Visayas Islands Group -->
        <!-- Panay Island -->
        <path d="M 186 224 C 183 228 183 234 187 236 C 190 234 191 229 189 225 Z" />
        <!-- Negros Island -->
        <path d="M 191 231 C 190 236 189 244 192 248 C 194 247 195 240 194 233 Z" />
        <!-- Cebu Island (long slim strip) -->
        <path d="M 196 230 C 195 236 195 244 197 247 C 198 245 198 238 197 231 Z" />
        <!-- Bohol Island -->
        <ellipse cx="200" cy="242" rx="3" ry="2.5" />
        <!-- Leyte & Samar -->
        <path d="M 203 220 C 205 224 208 229 206 235 C 203 237 200 231 202 223 Z" />
        <path d="M 203 234 C 201 239 201 245 204 248 C 205 245 206 240 205 235 Z" />

        <!-- Mindanao Island -->
        <!-- Zamboanga Peninsula -->
        <path d="M 184 254 C 180 258 178 266 183 268 C 187 266 189 261 187 256 Z" />
        <!-- Northern & Central Mindanao (Bukidnon, Lanao, Cotabato) -->
        <path d="M 188 255 C 192 252 201 252 205 256 C 208 261 207 270 202 274 C 196 276 190 273 188 266 C 187 260 187 257 188 255 Z" />
        <!-- Davao & Caraga / Eastern Mindanao -->
        <path d="M 206 256 C 210 258 213 265 211 274 C 209 278 206 276 205 271 C 204 266 205 259 206 256 Z" />
        <!-- Sulu Archipelago Chain -->
        <circle cx="178" cy="272" r="1.5" />
        <circle cx="175" cy="276" r="1.5" />
        <circle cx="172" cy="281" r="1.5" />
      </g>

      <!-- D. SPEECH BUBBLE WITH 3 MULTILINGUAL DOTS (In the P counter) -->
      <!-- Speech bubble body -->
      <g filter="url(#subtleDrop)">
        <path d="M 222 176 C 216 176 212 180 212 186 L 212 214 C 212 220 216 224 222 224 L 234 224 L 226 236 L 244 224 L 264 224 C 270 224 274 220 274 214 L 274 186 C 274 180 270 176 264 176 Z" fill="#FFFFFF" />
        <!-- Speech Bubble Border -->
        <path d="M 222 176 C 216 176 212 180 212 186 L 212 214 C 212 220 216 224 222 224 L 234 224 L 226 236 L 244 224 L 264 224 C 270 224 274 220 274 214 L 274 186 C 274 180 270 176 264 176 Z" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

        <!-- 3 Multilingual Conversation Dots (Blue, Red, Yellow) -->
        <circle cx="230" cy="200" r="5" fill="#0284C7" />
        <circle cx="243" cy="200" r="5" fill="#DC2626" />
        <circle cx="256" cy="200" r="5" fill="#F59E0B" />
      </g>

      <!-- Outer P Border Crisp Line -->
      <path d="M 172 142 L 285 142 C 328 142 355 168 355 208 C 355 248 328 274 285 274 L 218 274 L 218 368 L 172 368 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Inner Rim Contour line -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
</svg>
